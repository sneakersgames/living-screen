# Kiosk compositor config for the OpenDisplay iMac appliance: the receiver,
# and Moonlight and a terminal on workspaces of their own. The desktop
# (Ctrl+Alt+3) is not in here: it is a Hyprland session on another virtual
# terminal, see hyprland.lua.
# Local overrides: /etc/odimac/sway.d/*.conf (read last).

# Retina: the receiver reports this scale to the sender, which then builds a
# 2560x1440 "looks like" desktop on a 5K panel.
output * scale 2
output * bg #000000 solid_color

default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 1000
xwayland disable

# Restart the session (the service brings it straight back).
bindsym Mod4+Shift+Escape exit

# One workspace per mode (see /usr/lib/odimac/mode). --inhibited: these work
# while Moonlight has the keyboard grabbed for the game.
bindsym --inhibited Ctrl+Mod1+1 exec systemd-cat -t odimac-mode /usr/lib/odimac/mode display
bindsym --inhibited Ctrl+Mod1+2 exec systemd-cat -t odimac-mode /usr/lib/odimac/mode game
bindsym --inhibited Ctrl+Mod1+3 exec systemd-cat -t odimac-mode /usr/lib/odimac/mode desktop
bindsym --inhibited Ctrl+Mod1+4 exec systemd-cat -t odimac-mode /usr/lib/odimac/mode shell
# Brightness and volume keys, in every mode: during a game they act on the
# iMac and are not passed on to the PC.
bindsym --inhibited --locked XF86MonBrightnessUp exec brightnessctl -q set 5%+
bindsym --inhibited --locked XF86MonBrightnessDown exec brightnessctl -q -n 2 set 5%-
bindsym --inhibited --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --inhibited --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --inhibited --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Windows open on the workspace of their mode even when another one is
# showing. The receiver's window is placed by receiver-loop.
assign [app_id="^com\.moonlight_stream\.Moonlight$"] workspace game
assign [app_id="^foot$"] workspace shell

# Sound, for Moonlight and the desktop. The units are enabled for every user
# as packaged; this makes sure of it.
exec systemctl --user start pipewire.socket pipewire-pulse.socket wireplumber.service
exec /usr/lib/odimac/mode init
exec systemd-cat -t odimac-receiver /usr/lib/odimac/receiver-loop
exec systemd-cat -t odimac-powerd /usr/lib/odimac/powerd
exec systemd-cat -t odimac-mode /usr/lib/odimac/mode watch

include /etc/odimac/sway.d/*.conf

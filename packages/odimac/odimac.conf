# /etc/odimac/odimac.conf — settings for the OpenDisplay iMac appliance.
# Shell syntax. Changes apply after `systemctl restart odimac-kiosk`.

# Name shown in the Mac's OpenDisplay menu. Empty: the hostname.
RECEIVER_NAME=""

# What the receiver calls itself in the protocol. "Mac" makes the Mac sender
# treat this as a cabled Mac receiver: pulling the Thunderbolt cable then ends
# the session at once instead of the sender retrying for a while.
RECEIVER_DEVICE="Mac"

# Video decoder (a GStreamer element). avdec_h264 decodes on the CPU and
# shows each frame at once. The Radeon's vah264dec holds every frame back
# until the next one arrives, which measured about 20 ms slower per frame on
# an iMac18,3 and delays the last frame of every movement. "decodebin3" lets
# GStreamer choose (it picks the Radeon).
RECEIVER_DECODER="avdec_h264"

# Extra od-receiver arguments (see `od-receiver --help`), e.g. "--refresh 60".
RECEIVER_EXTRA_ARGS=""

# Seconds the panel stays lit with no sender connected: after boot, after a
# cable is plugged in, and after a session ends.
PANEL_OFF_DELAY=60

# Seconds with no Thunderbolt cable and no session before the machine
# suspends to RAM. 0 never suspends: the panel goes dark and the machine
# idles, which always wakes on plug-in. Set this only after
# `odimac-doctor suspend-test` showed that plugging the cable wakes the iMac.
SUSPEND_AFTER=0

# Panel brightness in percent, applied at start if the kernel exposes a
# backlight. Empty leaves it alone.
BRIGHTNESS=""

# --- Gaming mode (Ctrl+Alt+2): Moonlight, streaming from a PC that runs
# Sunshine or Apollo. Ctrl+Alt+1 returns to the Mac's display, Ctrl+Alt+3
# opens a terminal.

# The PC's address or name. Empty: Ctrl+Alt+2 opens Moonlight, where you pick
# the PC and the app (and pair, the first time). Set, once paired: Ctrl+Alt+2
# starts streaming GAME_APP at once. If that fails (the PC is off), Moonlight
# opens instead; its menu on the PC's tile has "Wake PC".
GAME_HOST=""
GAME_APP="Desktop"

# Stream size and rate with GAME_HOST, and Moonlight's initial settings
# without. 2560x1440 is exactly half the 5K panel each way; the panel is 60 Hz.
GAME_RESOLUTION="2560x1440"
GAME_FPS=60

# Seconds without keyboard or mouse input after which the gaming and terminal
# modes return to the Mac's display (a running stream does not count as
# idle). 0 never returns.
MODE_IDLE_RETURN=600

# Power-cycle the panel once when the session starts: auto (only with the 5K
# driver, which can otherwise show half the picture stretched), 1 or 0.
PANEL_POWER_CYCLE=auto

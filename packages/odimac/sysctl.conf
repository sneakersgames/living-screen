# Moonlight receives each video frame as a burst of UDP packets and asks for
# a large socket buffer to hold it. The kernel grants at most rmem_max, 208 KiB
# as shipped, and drops what does not fit: at 4K that shows as "slow
# connection" on a network that is not slow.
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608

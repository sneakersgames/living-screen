# Builds the ISO on GitHub's x86_64 runners, for people without an x86_64
# Docker host (an Apple silicon Mac, for example).
#   Actions -> Build ISO -> Run workflow: the ISO is attached to the run.
#   Pushing a tag like v0.2.0 also publishes it as a release.
name: Build ISO
on:
  workflow_dispatch:
    inputs:
      kernel:
        description: Arch kernel package to pin ("current" for the stock 4K driver)
        default: 7.2.11.arch1-1
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        env:
          KERNEL_PKGVER: ${{ inputs.kernel || '7.2.11.arch1-1' }}
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: odimac-iso
          path: out/*.iso
          retention-days: 14
          compression-level: 0
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.iso out/*.pkg.tar.zst --generate-notes
